version: '3.8'

services:
  dmrbeacon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmrbeacon
    restart: unless-stopped
    ports:
      - "54005:54005"
    volumes:
      - ./hblink.cfg:/usr/local/etc/hblink.cfg
    command: ["/usr/local/bin/dmrbeacon", "/usr/local/etc/hblink.cfg"]
